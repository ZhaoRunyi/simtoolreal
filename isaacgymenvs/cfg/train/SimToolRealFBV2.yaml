defaults:
  - SimToolRealFB
  - _self_

params:
  algo:
    name: fb_cpr
  config:
    name: ${resolve_default:SimToolRealFBV2,${....experiment}}
    minibatch_size: 6144
    learning_rate: 0.0003
    gamma: 0.98
    grad_norm: 1.0e30
    bounds_loss_coef: 0.0
    fb:
      latent_size: 256
      backward_state_size: 152
      auxiliary_reward_terms: [kuka_actions_penalty, hand_actions_penalty, object_lin_vel_penalty, object_ang_vel_penalty]
      residual_width: 2048
      residual_layers: 6
      history_steps: 4
      exploration_std: 0.05
      backward_learning_rate: 0.00001
      discriminator_learning_rate: 0.00001
      discriminator_penalty: 10.0
      orthogonal_coefficient: 100.0
      style_coefficient: 0.05
      auxiliary_coefficient: 0.02
      critic_target_tau: 0.005
      target_tau: 0.01
      command_steps: 100
      relabel_probability: 0.8
      replay_capacity: 5120000
      z_buffer_size: 8192
      expert_sequence_length: 8
      tracking_length: 250
      tracking_fraction: 0.5
      teacher_path: /home/MLTL-INTERN/shaoyang/zvi/dex_fb_ws/SimToolReal/pretrained_policy
      reference_stride: 25
      expert_steps: 1500
      expert_environments: 256
      updates_per_iteration: 4
      max_seconds: 12600
      stop_on_slow: false
