defaults:
  - SimToolRealFBV2
  - _self_

params:
  config:
    name: ${resolve_default:SimToolRealFBV3,${....experiment}}
    fb:
      # Same training budget/architecture/batch/update rate as the extended v2.
      target_frames: 2000000000
      max_seconds: 86400
      cache_tracking_command: false
      task_mix_probability: 0.0
      record_inference_pool: true
      log_command_sources: true
      inference_samples: 150000
      inference_seed: 7300
      inference_world_size: 4
      inference_method: mean
      inference_temperature: 0.1
      inference_batch_size: 2048
      inference_pool_glob: null
      command_bank_path: null
      evaluation_command_mode: phased
